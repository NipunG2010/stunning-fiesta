[project]
name = "chess-rl"
version = "0.1.0"
description = "Offline RL on human chess blunders"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "numpy>=1.26",
    "pyarrow>=15",
    "zstandard>=0.22",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "d3rlpy>=2.4",
    "wandb>=0.16",
    "omegaconf>=2.3",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_rl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
